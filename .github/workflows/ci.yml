name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:verify
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: python3 tools/local-analysis/test_mot.py
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: |
            playwright-report/
            test-results/
          retention-days: 3
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder-key' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_APP_NAME: SESEN
      - run: pnpm build:pages
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder-key' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_APP_NAME: SESEN
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && vars.NEXT_PUBLIC_SUPABASE_URL != '' && vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != ''
        with:
          name: pages-production-${{ github.sha }}
          path: dist/pages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Build isolated local acceptance bundle
        if: github.ref == 'refs/heads/main'
        run: pnpm build:pages
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54351
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3011
          NEXT_PUBLIC_APP_NAME: SESEN
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: pages-e2e-${{ github.sha }}
          path: dist/pages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
